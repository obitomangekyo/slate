name: CI

on:
  # Check changes entering each shared deployment branch, plus direct pushes.
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK: 0

jobs:
  verify:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm & Node.js
        # Use the action that installs this repository's pinned pnpm version.
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Run linters (Oxlint + Biome CI)
        run: pnpm lint:ci

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build

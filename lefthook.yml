commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{js,ts,jsx,tsx}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    biome:
      glob: "*.{js,ts,jsx,tsx,json,yaml,yml,md}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  parallel: false
  commands:
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    build:
      run: pnpm build

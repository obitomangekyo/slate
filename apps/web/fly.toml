app = "useslate-dev"

[build]
  dockerfile = "Dockerfile"


[http_service]
# The web container listens on this port inside Fly.
  internal_port = 8080
  force_https = true
  # Stop idle machines to reduce cost, then start them again when traffic returns.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  # Check the Nitro server directly instead of the protected page, which redirects signed-out users.
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  # Keep the web service on a single small shared machine for now.
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
